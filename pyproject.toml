[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claxcode"
version = "0.1.0"
description = "ClaxCode — An agentic coding assistant powered by FastAPI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "prompt-toolkit>=3.0.43",
    "paramiko>=3.4.0",
]

[project.optional-dependencies]
openai = ["openai>=1.54.0"]
anthropic = ["anthropic>=0.39.0"]
browser = ["playwright>=1.49.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.34.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
claxcode = "claxcode.main:run"
claxcode-cli = "claxcode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["claxcode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# cli.py must load .env before importing claxcode modules
"claxcode/cli.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
